[package]
name = "deadline"
version = "0.6.2"
edition = "2024"
description = "A haunted late-90s BBS text adventure for your terminal"
license = "Apache-2.0"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
directories = "6.0.0"
include_dir = "0.7.4"
ratatui = "0.30.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[profile.release]
strip = true
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
